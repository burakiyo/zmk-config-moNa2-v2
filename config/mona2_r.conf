#Mouse config ---------------------
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=y
# CONFIG_PMW3610_SWAP_XY=y
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting

# BLE でカーソルが遅れてついてくる対策 (modules/mona2_ble)。
# センサーは 8ms ごとに動きを出すが、Mac の受け取りがそれより遅いと、
# ZMK 標準の送信処理では送れなかった分が待ち行列に溜まり、カーソルが古い動きを
# 時間差でなぞる。これを、送れない間の動きを次に送る 1 件にまとめる処理に
# 差し替える。遅れは溜まらず、動きも捨てない。
CONFIG_MONA2_BLE_MOUSE_COALESCE=y
# CONFIG_PMW3610_REPORT_INTERVAL_MIN は使わない。ドライバの実装上、
# 間隔をあけて来た小さな動きを捨ててしまい、ゆっくり動かすと遅れて見える。

# センサーの省電力段階を浅くして、動かし始めの取りこぼしを減らす。
# 既定: 止めて 0.128 秒で 40ms 間隔、約 5 秒後に 100ms、約 22 秒後に 500ms。
# 変更後: 止めて 3.3 秒は全速 (8ms)、その後 20ms → 40ms → 100ms 間隔。
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100

#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n

#ZMK Studio config -------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# 広告データの機器の種類 (Appearance) を CONFIG_BT_DEVICE_APPEARANCE に合わせる。
# ZMK v0.3 は広告ではキーボード (0x03C1) に固定しているため。既定のままなら何も変わらない。
CONFIG_MONA2_BLE_ADV_APPEARANCE=y
