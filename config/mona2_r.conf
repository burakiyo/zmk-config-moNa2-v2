#Mouse config ---------------------
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INVERT_Y=y
# CONFIG_PMW3610_SWAP_XY=y
# CONFIG_PMW3610_LOG_LEVEL_DBG=y
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting

# なめらかさ優先の設定 (電池持ちより操作感を優先。右手は 1 週間もてば十分)
#
# CONFIG_PMW3610_REPORT_INTERVAL_MIN は使わない (既定 0)。
# badjeff 版ドライバの合算処理は、前回の読み取りから間隔以上空くと未送信の移動量を捨てる。
# ゆっくり細かく動かしたときほど移動量が抜け、カーソルがもたつく原因になる。
# 代わりにセンサーは 8ms ごと (約 125 回/秒) で読み、BLE 7.5ms (約 133 回/秒) に収める。
# 送りきれない分が溜まっても遅れが残らないよう、送信キューを短くする (既定 20)
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=4

# 省電力への落ち方を緩める。動き出しのもたつき対策
#   RUN -> REST1 までの時間を最大に (既定 128ms)
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
#   各 REST 段階での読み取り間隔を詰める (既定 40 / 100 / 500ms)
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100

# force-awake が効く ACTIVE 状態を長くする (既定 30 秒 -> 5 分)
CONFIG_ZMK_IDLE_TIMEOUT=300000

#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n

#ZMK Studio config -------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#Bluetooth config -------------------
# Mac に接続間隔 7.5ms (6 x 1.25ms) を希望する。最終的に決めるのは Mac 側
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
# 送信出力を nRF52840 の最大 (+8dBm) にして、電波の取りこぼしによる引っかかりを減らす
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
